# On-demand test run against a chosen environment. Start it from
#   Actions -> Manual test run -> Run workflow
# The reportingLabs report is published to GitHub Pages (gh-pages branch,
# folder manual/<env>/ -- the latest run per environment), e.g.
#   https://sksingh329.github.io/pytest-api-sample-framework/manual/stage/
# auto-run.yaml's main/ report is left as it is. Both reports are also attached
# to the run as a downloadable artifact.
#
# Tokens come from repository secrets named <ENV>_<ROLE>_TOKEN
# (DEV_DEFAULT_TOKEN, STAGE_DEFAULT_TOKEN, ...), the same names core/auth.py
# reads. Only the selected environment's tokens are used.
name: Manual test run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run against
        type: choice
        options: [dev, stage]
        default: dev
      tests:
        description: "Tests to run (folder, file, or file::Class::test)"
        type: string
        default: tests
      marker:
        description: Only tests with this marker
        type: choice
        # Only markers some test actually uses -- add one here when a test starts using it.
        options: [all, regression]
        default: all
      keyword:
        description: "Optional -k expression, e.g. create and not auth"
        type: string
        default: ""

permissions:
  contents: write

# Shared with auto-run.yaml so two publishes to gh-pages never race.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  run:
    name: pytest (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      # Run-history chart per environment, kept across runs.
      - uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-manual-${{ inputs.environment }}-${{ github.run_id }}
          restore-keys: reporting-labs-history-manual-${{ inputs.environment }}-

      # Inputs are passed through env vars, never inlined into the script,
      # so free-text fields can't inject shell commands.
      - name: Run pytest
        env:
          API_ENV: ${{ inputs.environment }}
          TESTS: ${{ inputs.tests }}
          MARKER: ${{ inputs.marker }}
          KEYWORD: ${{ inputs.keyword }}
          DEV_DEFAULT_TOKEN: ${{ secrets.DEV_DEFAULT_TOKEN }}
          DEV_READ_TOKEN: ${{ secrets.DEV_READ_TOKEN }}
          DEV_WRITE_TOKEN: ${{ secrets.DEV_WRITE_TOKEN }}
          STAGE_DEFAULT_TOKEN: ${{ secrets.STAGE_DEFAULT_TOKEN }}
          STAGE_READ_TOKEN: ${{ secrets.STAGE_READ_TOKEN }}
          STAGE_WRITE_TOKEN: ${{ secrets.STAGE_WRITE_TOKEN }}
        run: |
          args=("$TESTS" --rl-output reporting-labs --rl-title "API tests - $API_ENV")
          if [ "$MARKER" != "all" ]; then args+=(-m "$MARKER"); fi
          if [ -n "$KEYWORD" ]; then args+=(-k "$KEYWORD"); fi
          echo "pytest ${args[*]}"
          pytest "${args[@]}"

      # Runs even when tests failed; the job stays red from the pytest step.
      - name: Publish report
        if: always() && hashFiles('reporting-labs/index.html') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_ENV: ${{ inputs.environment }}
        run: bash .github/scripts/publish-report.sh reporting-labs "manual/$API_ENV" "manual · $API_ENV"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.environment }}-${{ github.run_number }}
          path: |
            reporting-labs/
            reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        env:
          API_ENV: ${{ inputs.environment }}
          TESTS: ${{ inputs.tests }}
          MARKER: ${{ inputs.marker }}
          KEYWORD: ${{ inputs.keyword }}
        run: |
          {
            echo "### Manual test run"
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| Environment | \`$API_ENV\` |"
            echo "| Tests | \`$TESTS\` |"
            echo "| Marker | \`$MARKER\` |"
            echo "| Keyword | \`${KEYWORD:-none}\` |"
            echo ""
            echo "Reports are also attached below as the \`reports-$API_ENV-${{ github.run_number }}\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
