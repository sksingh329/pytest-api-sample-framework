# Runs the API suite against dev on every push to main and publishes the
# reportingLabs HTML report to GitHub Pages (gh-pages branch, folder main/):
#   https://sksingh329.github.io/pytest-api-sample-framework/main/
# The site root lists every published report (see manual-run.yml too).
#
# One-time repo setup:
#   Settings -> Pages -> Build and deployment -> Source: Deploy from a branch,
#     branch gh-pages, folder / (root)  -- the branch appears after the first run
#   Settings -> Secrets and variables -> Actions -> New secret: DEV_DEFAULT_TOKEN
name: API tests + report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Every workflow that writes to gh-pages shares this group, so two publishes
# never race; queued runs wait instead of being cancelled.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      # Keeps the report's run-history chart across CI runs (each run starts
      # from a clean checkout, and the history file is gitignored).
      - uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ github.run_id }}
          restore-keys: reporting-labs-history-

      # A failing test must still produce and publish a report, so this step
      # doesn't stop the job; the last step turns a test failure red again.
      - id: pytest
        continue-on-error: true
        run: pytest --rl-output site
        env:
          API_ENV: dev
          DEV_DEFAULT_TOKEN: ${{ secrets.DEV_DEFAULT_TOKEN }}

      - name: Publish report
        if: always() && hashFiles('site/index.html') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-report.sh site main "main · dev"

      - if: steps.pytest.outcome != 'success'
        run: |
          echo "::error::Tests failed - see the published report"
          exit 1
