# Runs the API suite against dev on every push to main and publishes the
# reportingLabs HTML report to GitHub Pages:
#   https://sksingh329.github.io/pytest-api-sample-framework/
#
# One-time repo setup:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   Settings -> Secrets and variables -> Actions -> New secret: DEV_DEFAULT_TOKEN
name: API tests + report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.pytest.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      # Keeps the report's run-history chart across CI runs (each run starts
      # from a clean checkout, and the history file is gitignored).
      - uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ github.run_id }}
          restore-keys: reporting-labs-history-

      # A failing test must still produce and publish a report, so this step
      # doesn't stop the job; the last job turns a test failure red again.
      - id: pytest
        continue-on-error: true
        run: pytest --rl-output site
        env:
          API_ENV: dev
          DEV_DEFAULT_TOKEN: ${{ secrets.DEV_DEFAULT_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  result:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.outputs.tests != 'success'
        run: |
          echo "::error::Tests failed - see the published report"
          exit 1
