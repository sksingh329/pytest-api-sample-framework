[pytest]
# --- standard pytest wiring -------------------------------------------------
testpaths = tests
addopts = -ra
markers =
    smoke: critical-path checks, must stay minutes not tens of minutes
    regression: happy path / negative / permission / boundary suites
    contract: schema-only suites that catch API drift

# --- framework ini options (core/plugin.py registers all of these) --------
# Every key below can be overridden by an environment variable for CI.
# The env var name is API_<KEY UPPERCASED WITHOUT THE api_ PREFIX>, e.g.
# api_env -> API_ENV, api_timeout -> API_TIMEOUT. See core/config.py.

# selects which key of environments.ENVIRONMENTS is active (dev | stage | prod)
api_env = dev

# detail carried by each request/assertion record: ERROR|WARNING|INFO|DEBUG|TRACE
# levels are additive (see README) and never change *what* runs, only how
# much evidence each record carries.
api_log_level = DEBUG

# per-request timeout in seconds
api_timeout = 30

# attempts for transport errors and retryable (429/502/503/504) statuses
api_retries = 2

# output dir. Each run writes to api_report_dir/<api_env>/<timestamp>/
# (report.html, summary.json); the per-worker ledgers live under
# api_report_dir/<api_env>/ledger/ and history.json (last 12 runs, for the
# report's history chart) lives at api_report_dir/<api_env>/history.json.
api_report_dir = reports/

# keys masked before anything is written to disk (comma separated)
api_redact_keys = authorization, password, token

# body truncation cap (characters) before an explicit [...truncated...] marker
api_max_body_chars = 4000

# latency threshold (ms) that emits a non-failing WARNING record
api_latency_budget_ms = 800

# root directory the SchemaRegistry indexes JSON Schema contracts from
api_schema_dir = api/schemas

# --- environments ------------------------------------------------------
# base_url is NOT set here -- all environments live in one place,
# environments.py's ENVIRONMENTS dict, read by core/config.py (still
# overridable by API_BASE_URL for CI). To add a new environment, add a new
# key to ENVIRONMENTS -- api_env selects it by name.
#
# Auth is a fixed bearer token per (environment, role), read from .env by
# core/auth.py -- see .env.example. There is no auth_url/login flow: API
# tests use a fixed token, not a session to acquire and refresh.
